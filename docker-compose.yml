version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: medpulse-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - medpulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpulse-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/hospital_management
      - JWT_SECRET=medpulse_super_secure_production_jwt_secret_2026!
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - medpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medpulse-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - PORT=3000
    depends_on:
      - backend
    networks:
      - medpulse-network

networks:
  medpulse-network:
    driver: bridge

volumes:
  mongo-data:
  backend-uploads:
